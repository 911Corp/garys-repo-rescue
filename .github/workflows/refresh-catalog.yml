# Rebuilds the catalog and opens a pull request with the result. Never deploys.
name: Refresh catalog
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      analyze_limit:
        description: Projects analyzed in depth
        default: '1000'
      index_limit:
        description: Extra projects indexed from search only
        default: '500'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ETag cache: unchanged resources answer 304 and do not consume the primary rate limit.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Collect
        env:
          # The default GITHUB_TOKEN allows ~1,000 REST requests/hour: enough for search, not for deep
          # per-repo analysis. Add a fine-grained PAT (public repos, read-only) as CATALOG_TOKEN to use
          # the full GitHub provider; otherwise enrichment falls back to ecosyste.ms.
          GITHUB_TOKEN: ${{ secrets.CATALOG_TOKEN || github.token }}
          ENRICH_PROVIDER: ${{ secrets.CATALOG_TOKEN && 'auto' || 'ecosystems' }}
          ANALYZE_LIMIT: ${{ inputs.analyze_limit || '1000' }}
          INDEX_LIMIT: ${{ inputs.index_limit || '500' }}
        run: npm run collect
      - run: npm run validate
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog/refresh
          title: 'Catalog refresh'
          commit-message: 'chore(catalog): refresh'
          body: Automated catalog refresh. Review `npm run validate` output in the workflow log before merging.
          add-paths: public/data/catalog.json
